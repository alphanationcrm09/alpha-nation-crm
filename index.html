<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Nation CRM</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#f5f5f5;font:14px system-ui,Arial}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(420px,100%);background:#111;border:1px solid #292929;border-radius:14px;padding:25px}
input,select,textarea{width:100%;background:#090909;color:#fff;border:1px solid #333;border-radius:7px;padding:10px;margin-top:5px}
label{display:block;color:#aaa;font-size:12px;margin-top:12px}
.btn{background:#eee;color:#111;border:0;border-radius:7px;padding:10px 14px;font-weight:700;margin-top:14px;cursor:pointer}
.btn.dark{background:#191919;color:#fff;border:1px solid #333}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:12px;color:#ff8888}
.ok{color:#7ee787}
.muted{color:#999}

aside{
position:fixed;inset:0 auto 0 0;width:225px;background:#101010;
border-right:1px solid #292929;padding:18px 12px;overflow:auto
}

.brand{font-size:20px;font-weight:900;padding:8px 8px 18px}

nav button{
display:block;width:100%;padding:10px;background:none;border:0;
color:#aaa;text-align:left;border-radius:7px;margin:3px 0;cursor:pointer
}

nav button:hover,nav button.active{background:#222;color:#fff}

main{margin-left:225px;padding:24px;max-width:1600px}

.top{
display:flex;justify-content:space-between;
align-items:center;margin-bottom:20px
}

.top h1{margin:0}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.card,.panel{
background:#111;
border:1px solid #292929;
border-radius:10px
}

.card{padding:16px}
.num{font-size:24px;font-weight:800;margin-top:6px}

.panel{margin-top:18px;overflow:auto}

.ph{
padding:14px 16px;
border-bottom:1px solid #292929;
display:flex;
justify-content:space-between;
align-items:center
}

.body{padding:16px}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid #292929;white-space:nowrap}
th{font-size:12px;color:#999}

.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:12px
}

.modal{
position:fixed;
inset:0;
background:#000b;
display:grid;
place-items:center;
padding:15px;
z-index:20
}

.modalbox{
width:min(900px,100%);
max-height:90vh;
overflow:auto;
background:#121212;
border:1px solid #333;
border-radius:12px;
padding:20px
}

.form{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

.wide{grid-column:1/-1}

.badge{
padding:3px 8px;
border-radius:999px;
background:#222;
font-size:11px
}

.role-owner{color:#7ee787}
.role-admin{color:#79c0ff}
.role-team{color:#f2cc60}

@media(max-width:850px){
aside{width:60px}
.brand{font-size:0}
.brand:after{content:'AN';font-size:18px}
nav button{font-size:0;text-align:center}
nav button:after{content:'•';font-size:20px}
main{margin-left:60px;padding:14px}
.grid{grid-template-columns:repeat(2,1fr)}
.form{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="login" class="login">
<div class="box">

<div class="brand">ALPHA NATION</div>

<h2>CRM Login</h2>

<p class="muted">
Authorized users only. Accounts are created by Owner/Admin.
</p>

<label>
Email / User ID
<input id="email" type="email" autocomplete="username">
</label>

<label>
Password
<input id="password" type="password" autocomplete="current-password">
</label>

<button id="loginBtn" class="btn">
Sign in
</button>

<div id="msg" class="msg"></div>

<div id="conn" class="muted">
Connecting...
</div>

</div>
</div>


<div id="app" class="hidden">

<aside>

<div class="brand">ALPHA NATION</div>

<nav id="nav">

<button data-page="dashboard">
Dashboard
</button>

<button data-page="policies">
Policies
</button>

<button data-page="applications">
Applications
</button>

<button class="adminOnly" data-page="leads">
Leads
</button>

<button class="adminOnly" data-page="calls">
Calls
</button>

<button class="adminOnly" data-page="buyers">
Buyers
</button>

<button class="adminOnly" data-page="carriers">
Carriers
</button>

<button class="adminOnly" data-page="agreements">
Agreements
</button>
