.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#39;");

/* =========================================================
   INITIALIZE SUPABASE
========================================================= */

function initializeSupabase(){

try{

if(!window.supabase){

throw new Error(
"Supabase library did not load. Check your internet connection."
);

}

supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

return true;

}catch(error){

setLoginMessage(
"Supabase initialization failed: "+
error.message,
"error"
);

return false;

}

}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(user){

const result=await supabaseClient
.from("profiles")
.select(`
id,
full_name,
role,
active,
created_at,
updated_at,
email,
team_id
`)
.eq("id",user.id)
.maybeSingle();

if(result.error){

throw new Error(
"Profile error: "+
result.error.message
);

}

if(!result.data){

throw new Error(
"No CRM profile exists for this login. Ask the Owner to create your CRM profile."
);

}

if(!["Owner","Admin","Team"].includes(result.data.role)){

throw new Error(
"Invalid CRM role."
);

}

if(result.data.active===false){

throw new Error(
"Your CRM account is disabled."
);

}

profile=result.data;

currentUser=user;

}


/* =========================================================
   AUTH
========================================================= */

async function login(){

const email=$("loginEmail").value.trim();
const password=$("loginPassword").value;

if(!email||!password){

setLoginMessage(
"Enter your email and password.",
"error"
);

return;

}

$("loginButton").disabled=true;
$("loginButton").textContent="Signing in...";

try{

const result=
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(result.error){

throw result.error;

}

await loadProfile(result.data.user);

showApp();

goTo("dashboard");

}catch(error){

await supabaseClient.auth.signOut().catch(()=>{});

setLoginMessage(
error.message||
"Sign in failed.",
"error"
);

}finally{

$("loginButton").disabled=false;
$("loginButton").textContent="Sign in";

}

}


/* =========================================================
   FORGOT PASSWORD
========================================================= */

async function forgotPassword(){

const email=$("loginEmail").value.trim();

if(!email){

setLoginMessage(
"Enter your email first, then click Forgot password.",
"error"
);

$("loginEmail").focus();

return;

}

setLoginMessage(
"Sending password reset email...",
"muted"
);

try{

const redirectURL=
window.location.origin+
window.location.pathname;

const result=
await supabaseClient.auth.resetPasswordForEmail(
email,
{
redirectTo:redirectURL
}
);

if(result.error){

throw result.error;

}

setLoginMessage(
"Password reset email sent. Check your email inbox.",
"success"
);

}catch(error){

setLoginMessage(
"Password reset failed: "+
error.message,
"error"
);

}

}


/* =========================================================
   SHOW APP
========================================================= */

function showApp(){

$("loginScreen").classList.add("hidden");

$("app").classList.remove("hidden");

applyPermissions();

renderUserInfo();

}

function renderUserInfo(){

if(!profile)return;

let roleClass=
profile.role==="Owner"
?
"roleOwner"
:
profile.role==="Admin"
?
"roleAdmin"
:
"roleTeam";

$("userInfo").innerHTML=`
<span class="${roleClass}">
${escapeHTML(profile.role)}
</span>
|
${escapeHTML(
profile.full_name||
profile.email||
currentUser?.email||
""
)}
`;

}


/* =========================================================
   PERMISSIONS
========================================================= */

function applyPermissions(){

document
.querySelectorAll(".restricted")
.forEach(button=>{

button.style.display=
isAdminOrOwner()
?
"block"
:
"none";

});

}


/* =========================================================
   TEAM FILTER
========================================================= */

function applyTeamFilter(query,table){

if(
isTeam() &&
profile?.team_id &&
[
"policies",
"applications",
"leads",
"calls",
"team_payouts"
].includes(table)
){

return query.eq(
"team_id",
profile.team_id
);

}

return query;

}
