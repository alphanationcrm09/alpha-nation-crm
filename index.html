<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Nation CRM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#f5f5f5;font:14px system-ui,Arial}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(430px,100%);background:#111;border:1px solid #292929;border-radius:14px;padding:25px}
.brand{font-size:21px;font-weight:900;letter-spacing:.5px}
.muted{color:#999}
label{display:block;color:#aaa;font-size:12px;margin-top:11px}
input,select,textarea{width:100%;background:#090909;color:#fff;border:1px solid #333;border-radius:7px;padding:10px;margin-top:5px}
textarea{min-height:90px;resize:vertical}
.btn{background:#eee;color:#111;border:0;border-radius:7px;padding:10px 14px;font-weight:700;margin-top:12px;cursor:pointer}
.btn.dark{background:#191919;color:#fff;border:1px solid #333}
.btn.red{background:#8b2020;color:#fff}
.btn:disabled{opacity:.5}
.msg{margin-top:12px;line-height:1.5}
.error{color:#ff7777}
.success{color:#7ee787}
.status{margin-top:12px;padding:9px;border:1px solid #292929;border-radius:7px;color:#999;font-size:12px;word-break:break-word}
aside{position:fixed;inset:0 auto 0 0;width:225px;background:#101010;border-right:1px solid #292929;padding:18px 12px;overflow:auto}
nav button{display:block;width:100%;padding:10px;background:none;border:0;color:#aaa;text-align:left;border-radius:7px;margin:3px 0;cursor:pointer}
nav button:hover,nav button.active{background:#222;color:#fff}
main{margin-left:225px;padding:24px;max-width:1700px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.top h1{margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card,.panel{background:#111;border:1px solid #292929;border-radius:10px}
.card{padding:16px}.num{font-size:24px;font-weight:800;margin-top:6px}
.panel{margin-top:18px;overflow:auto}
.ph{padding:14px 16px;border-bottom:1px solid #292929;display:flex;justify-content:space-between;align-items:center;gap:10px}
.body{padding:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{margin:0;max-width:400px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px;border-bottom:1px solid #292929;white-space:nowrap}
th{font-size:11px;color:#999}
.actions{display:flex;gap:5px}
.actions .btn{margin:0;padding:6px 9px;font-size:12px}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:15px;z-index:50}
.modalbox{width:min(1000px,100%);max-height:92vh;overflow:auto;background:#121212;border:1px solid #333;border-radius:12px;padding:20px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wide{grid-column:1/-1}
.formActions{display:flex;gap:8px;justify-content:flex-end}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#222;font-size:11px}
.link{background:none;border:0;color:#aaa;cursor:pointer;padding:9px 0}
@media(max-width:850px){
aside{width:60px}
aside .brand{font-size:0}
aside .brand:after{content:"AN";font-size:18px}
nav button{font-size:0;text-align:center}
nav button:after{content:"•";font-size:20px}
main{margin-left:60px;padding:14px}
.grid{grid-template-columns:repeat(2,1fr)}
.form{grid-template-columns:1fr}
}
</style>
</head>

/* ---------- Utility ---------- */

function esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#39;");
}

function setStatus(text,error=false){
$("status").textContent=text;
$("status").className="status "+(error?"error":"");
}

function msg(text,error=true){
$("msg").textContent=text;
$("msg").className="msg "+(error?"error":"success");
}

function clearMsg(){
$("msg").textContent="";
$("msg").className="msg";
}

async function waitForSupabase(){

for(let i=0;i<100;i++){

if(window.supabase&&window.supabase.createClient){

db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

return;

}

await new Promise(r=>setTimeout(r,100));

}

throw new Error("Supabase library could not be loaded.");

}


/* ---------- Authentication ---------- */

async function loadProfile(){

const r=await db
.from("profiles")
.select("id,email,full_name,role,active,team_id")
.eq("id",user.id)
.maybeSingle();

if(r.error)throw r.error;

profile=r.data;

if(!profile){
throw new Error("No CRM profile exists for this account.");
}

if(profile.active===false){
throw new Error("Your CRM account is inactive.");
}

}

function isAdmin(){
const r=String(profile?.role||"").toLowerCase();
return r==="owner"||r==="admin";
}

function isViewer(){
return String(profile?.role||"").toLowerCase()==="viewer";
}

async function login(){

clearMsg();

const email=$("email").value.trim();
const password=$("password").value;

if(!email||!password){
msg("Enter your email and password.");
return;
}

$("loginBtn").disabled=true;
$("loginBtn").textContent="Signing in...";
setStatus("Authenticating...");

try{

const r=await db.auth.signInWithPassword({
email,
password
});

if(r.error)throw r.error;

user=r.data.user;

await loadProfile();

$("login").classList.add("hidden");
$("app").classList.remove("hidden");

$("who").textContent=
`${profile.full_name||user.email} | ${profile.role}`;

setStatus("CRM connected.","success");

go("dashboard");

}catch(e){

console.error(e);
msg(e.message||"Sign in failed.");
setStatus("Authentication failed.",true);

}finally{

$("loginBtn").disabled=false;
$("loginBtn").textContent="Sign in";

}

}

async function logout(){
await db.auth.signOut();
location.reload();
}

async function forgotPassword(){

clearMsg();

const email=$("email").value.trim();

if(!email){
msg("Enter your email first.");
return;
}

try{

const r=await db.auth.resetPasswordForEmail(email,{
redirectTo:"https://alphanationcrm09.github.io/alpha-nation-crm/"
});

if(r.error)throw r.error;

msg("Password reset instructions were sent to your email.",false);

}catch(e){
msg(e.message||"Unable to send reset email.");
}

}


/* ---------- Data ---------- */

async function fetchRows(table){

let q=db.from(table).select("*");

if(profile?.team_id&&table!=="teams"&&!isAdmin()){

q=q.eq("team_id",profile.team_id);

}

const r=await q
.order("created_at",{ascending:false})
.limit(500);

if(r.error)throw r.error;

return r.data||[];

}

async function lookup(table){

const r=await db.from(table).select("*").limit(1000);

if(r.error)return[];

return r.data||[];

}

async function relationData(type){

if(type==="buyer")return lookup("buyers");
if(type==="carrier")return lookup("carriers");
if(type==="campaign")return lookup("campaigns");
if(type==="agreement")return lookup("agreements");
if(type==="lead")return lookup("leads");
if(type==="policy")return lookup("policies");
if(type==="profile")return lookup("profiles");

return[];

}

/* ---------- Tables ---------- */

async function renderTable(){

const cfg=pageConfig[currentPage];

if(!cfg)return;

setStatus(`Loading ${cfg.title}...`);

try{

currentRows=await fetchRows(cfg.table);

let html=`

<div class="panel">

<div class="ph">

<b>${cfg.title}</b>

<button class="btn" onclick="openForm()">
+ Add ${cfg.title.slice(0,-1)||"Record"}
</button>

</div>

<div class="body">

<div class="toolbar">

<input
id="search"
placeholder="Search ${cfg.title}..."
oninput="filterTable()">

</div>

<div id="tableArea">
${buildTable(currentRows)}
</div>

</div>
</div>
`;

$("content").innerHTML=html;

setStatus(`${currentRows.length} records loaded.`);

}catch(e){

$("content").innerHTML=`
<div class="panel">
<div class="body error">${esc(e.message)}</div>
</div>`;

setStatus("Database error.",true);

}

}

function buildTable(rows){

const cfg=pageConfig[currentPage];

if(!rows.length){

return `<p class="muted">No records found. Click + Add to create one.</p>`;

}

let html="<table><thead><tr>";

for(const c of cfg.columns){
html+=`<th>${esc(c[1])}</th>`;
}

html+="<th>Actions</th></tr></thead><tbody>";

for(const row of rows){

html+="<tr>";

for(const c of cfg.columns){

let value=row[c[0]];

if(typeof value==="boolean"){
value=value?"Yes":"No";
}

if(value&&String(value).length>35){
value=String(value).slice(0,35)+"...";
}

html+=`<td>${esc(value)}</td>`;

}

html+=`

<td>

<div class="actions">

<button class="btn dark"
onclick="openForm('${row.id}')">
Edit
</button>

<button class="btn red"
onclick="removeRecord('${row.id}')">
Delete
</button>

</div>

</td>
</tr>`;

}

html+="</tbody></
