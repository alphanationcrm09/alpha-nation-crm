<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Nation CRM</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080808;
color:#f5f5f5;
font:14px system-ui,Arial,sans-serif
}

.hidden{display:none!important}

.login{
min-height:100vh;
display:grid;
place-items:center;
padding:20px
}

.box{
width:min(420px,100%);
background:#111;
border:1px solid #292929;
border-radius:14px;
padding:25px
}

.brand{
font-size:21px;
font-weight:900;
letter-spacing:.5px
}

h2{margin-bottom:8px}

.muted{color:#999}

label{
display:block;
color:#aaa;
font-size:12px;
margin-top:15px
}

input,select,textarea{
width:100%;
background:#090909;
color:#fff;
border:1px solid #333;
border-radius:7px;
padding:11px;
margin-top:6px;
outline:none
}

input:focus,select:focus,textarea:focus{
border-color:#777
}

.btn{
background:#eee;
color:#111;
border:0;
border-radius:7px;
padding:11px 15px;
font-weight:700;
margin-top:15px;
cursor:pointer
}

.btn:disabled{
opacity:.5;
cursor:not-allowed
}

.dark{
background:#191919;
color:#fff;
border:1px solid #333
}

.link{
background:none;
border:0;
color:#aaa;
cursor:pointer;
padding:10px 0;
font-size:13px
}

.link:hover{color:#fff}

.msg{
margin-top:13px;
line-height:1.5
}

.error{color:#ff8888}
.success{color:#7ee787}

.status{
margin-top:15px;
padding:10px;
border-radius:7px;
background:#0d0d0d;
border:1px solid #222;
color:#aaa;
font-size:12px;
word-break:break-word
}

aside{
position:fixed;
inset:0 auto 0 0;
width:225px;
background:#101010;
border-right:1px solid #292929;
padding:18px 12px;
overflow:auto
}

nav button{
display:block;
width:100%;
padding:10px;
background:none;
border:0;
color:#aaa;
text-align:left;
border-radius:7px;
margin:3px 0;
cursor:pointer
}

nav button:hover,
nav button.active{
background:#222;
color:#fff
}

main{
margin-left:225px;
padding:24px;
max-width:1600px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px
}

.top h1{margin:0}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.card,.panel{
background:#111;
border:1px solid #292929;
border-radius:10px
}

.card{padding:16px}

.num{
font-size:24px;
font-weight:800;
margin-top:6px
}

.panel{
margin-top:18px;
overflow:auto
}

.body{padding:16px}

.ph{
padding:14px 16px;
border-bottom:1px solid #292929;
display:flex;
justify-content:space-between;
align-items:center
}

table{
width:100%;
border-collapse:collapse
}

th,td{
text-align:left;
padding:10px;
border-bottom:1px solid #292929;
white-space:nowrap
}

th{
font-size:12px;
color:#999
}

@media(max-width:850px){

aside{width:60px}

aside .brand{
font-size:0
}

aside .brand:after{
content:"AN";
font-size:18px
}

nav button{
font-size:0;
text-align:center
}

nav button:after{
content:"•";
font-size:20px
}

main{
margin-left:60px;
padding:14px
}

.grid{
grid-template-columns:repeat(2,1fr)
}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">

<div class="box">

<div class="brand">ALPHA NATION</div>

<h2>CRM Login</h2>

<p class="muted">
Authorized users only. Accounts are created by Owner/Admin.
</p>

<label>
Email
<input
id="email"
type="email"
autocomplete="username"
placeholder="you@example.com">
</label>

<label>
Password
<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Password">
</label>

<button id="loginBtn" class="btn">
Sign in
</button>

<div>
<button id="forgotBtn" class="link">
Forgot password?
</button>
</div>

<div id="message" class="msg"></div>

<div id="status" class="status">
Starting CRM...
</div>

</div>
</div>


<!-- APP -->
<div id="app" class="hidden">

<aside>

<div class="brand">ALPHA NATION</div>

<nav id="nav">

<button data-page="dashboard">Dashboard</button>
<button data-page="policies">Policies</button>
<button data-page="applications">Applications</button>
<button data-page="leads">Leads</button>
<button data-page="calls">Calls</button>
<button data-page="buyers">Buyers</button>
<button data-page="carriers">Carriers</button>
<button data-page="agreements">Agreements</button>
<button data-page="payments">Payments</button>
<button data-page="chargebacks">Chargebacks</button>
<button data-page="teams">Team Management</button>

</nav>

<button id="logoutBtn" class="btn dark">
Sign out
</button>

</aside>

<main>

<div class="top">

<div>
<h1 id="pageTitle">Dashboard</h1>
<div id="userInfo" class="muted"></div>
</div>

</div>

<section id="content"></section>

</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

/*
====================================================
SUPABASE CONFIGURATION
====================================================
*/

const SUPABASE_URL =
"https://yzhtisfmlowkcvavgsxd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GIhI_6sDVvzggGR1nVvEBg_psCt4iQu";


/*
====================================================
ELEMENTS
====================================================
*/

const loginPage = document.getElementById("loginPage");
const app = document.getElementById("app");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");
const forgotBtn = document.getElementById("forgotBtn");
const logoutBtn = document.getElementById("logoutBtn");

const message = document.getElementById("message");
const statusBox = document.getElementById("status");

const userInfo = document.getElementById("userInfo");
const pageTitle = document.getElementById("pageTitle");
const content = document.getElementById("content");
const nav = document.getElementById("nav");


/*
====================================================
STATE
====================================================
*/

let db = null;
let currentUser = null;
let currentPage = "dashboard";


/*
====================================================
HELPERS
====================================================
*/

function setStatus(text, type="normal"){

statusBox.textContent = text;

statusBox.className = "status";

if(type === "error"){
statusBox.classList.add("error");
}

if(type === "success"){
statusBox.classList.add("success");
}

}


function setMessage(text, type="error"){

message.textContent = text;

message.className = "msg";

if(type === "success"){
message.classList.add("success");
}else{
message.classList.add("error");
}

}


function clearMessage(){
message.textContent="";
message.className="msg";
}


/*
====================================================
WAIT FOR SUPABASE
====================================================
*/

function waitForSupabase(){

return new Promise((resolve,reject)=>{

let attempts=0;

const timer=setInterval(()=>{

attempts++;

if(
window.supabase &&
typeof window.supabase.createClient === "function"
){

clearInterval(timer);

try{

db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

resolve(db);

}catch(error){

clearInterval(timer);
reject(error);

}

return;
}

if(attempts>=100){

clearInterval(timer);

reject(
new Error(
"Supabase library could not be loaded. Check your internet connection or CDN access."
)
);

}

},100);

});

}


/*
====================================================
SHOW LOGIN
====================================================
*/

function showLogin(){

loginPage.classList.remove("hidden");
app.classList.add("hidden");

}


/*
====================================================
SHOW APP
====================================================
*/

function showApp(){

loginPage.classList.add("hidden");
app.classList.remove("hidden");

if(currentUser){

userInfo.textContent =
currentUser.email || "Authenticated user";

}

}


/*
====================================================
LOGIN
====================================================
*/

async function login(){

clearMessage();

const email=emailInput.value.trim();
const password=passwordInput.value;

if(!email){

setMessage("Enter your email.");
return;

}

if(!password){

setMessage("Enter your password.");
return;

}

if(!db){

setMessage(
"CRM is still initializing. Please wait for the status above."
);

return;

}

loginBtn.disabled=true;
loginBtn.textContent="Signing in...";

setStatus("Connecting to Supabase...");

try{

const result =
await db.auth.signInWithPassword({
email:email,
password:password
});

if(result.error){

throw result.error;

}

if(!result.data || !result.data.user){

throw new Error(
"Supabase accepted the request but returned no user."
);

}

currentUser=result.data.user;

setStatus(
"Authentication successful.",
"success"
);

setMessage(
"Signed in successfully.",
"success"
);

showApp();

renderDashboard();

}catch(error){

console.error("LOGIN ERROR:",error);

setMessage(
error?.message ||
"Sign in failed."
);

setStatus(
"Authentication failed: "+
(error?.message || "Unknown error"),
"error"
);

}finally{

loginBtn.disabled=false;
loginBtn.textContent="Sign in";

}

}


/*
====================================================
FORGOT PASSWORD
====================================================
*/

async function forgotPassword(){

clearMessage();

const email=emailInput.value.trim();

if(!email){

setMessage(
"Enter your email first, then click Forgot password."
);

return;

}

if(!db){

setMessage(
"CRM has not finished connecting to Supabase."
);

return;

}

forgotBtn.disabled=true;
forgotBtn.textContent="Sending...";

try{

const result =
await db.auth.resetPasswordForEmail(
email,
{
redirectTo:
"https://alphanationcrm09.github.io/alpha-nation-crm/"
}
);

if(result.error){

throw result.error;

}

setMessage(
"Password reset instructions have been sent to your email.",
"success"
);

}catch(error){

console.error("RESET ERROR:",error);

setMessage(
error?.message ||
"Could not send password reset email."
);

}finally{

forgotBtn.disabled=false;
forgotBtn.textContent="Forgot password?";

}

}


/*
====================================================
LOGOUT
====================================================
*/

async function logout(){

if(db){

await db.auth.signOut();

}

currentUser=null;

showLogin();

setStatus(
"Signed out."
);

clearMessage();

}


/*
====================================================
DASHBOARD
====================================================
*/

function renderDashboard(){

currentPage="dashboard";

pageTitle.textContent="Dashboard";

nav.querySelectorAll("button").forEach(button=>{

button.classList.toggle(
"active",
button.dataset.page==="dashboard"
);

});

content.innerHTML=`

<div class="grid">

<div class="card">
<div class="muted">CRM Status</div>
<div class="num">Online</div>
</div>

<div class="card">
<div class="muted">Authentication</div>
<div class="num">Active</div>
</div>

<div class="card">
<div class="muted">User</div>
<div class="num">Logged In</div>
</div>

<div class="card">
<div class="muted">System</div>
<div class="num">Ready</div>
</div>

</div>

<div class="panel">

<div class="body">

<h3>Alpha Nation CRM</h3>

<p class="muted">
You are successfully authenticated.
</p>

<p>
Logged in as:
<strong>${escapeHtml(currentUser?.email || "")}</strong>
</p>

</div>

</div>

`;

}


/*
====================================================
PLACEHOLDER PAGES
====================================================
*/

const pages={

policies:"Policies",
applications:"Applications",
leads:"Leads",
calls:"Calls",
buyers:"Buyers",
carriers:"Carriers",
agreements:"Agreements",
payments:"Payments",
chargebacks:"Chargebacks",
teams:"Team Management"

};


function openPage(page){

if(page==="dashboard"){

renderDashboard();
return;

}

currentPage=page;

pageTitle.textContent=pages[page] || page;

nav.querySelectorAll("button").forEach(button=>{

button.classList.toggle(
"active",
button.dataset.page===page
);

});

content.innerHTML=`

<div class="panel">

<div class="body">

<h2>${escapeHtml(pages[page] || page)}</h2>

<p class="muted">
The authentication system is working. This CRM module is ready for the database records to be connected.
</p>

</div>

</div>

`;

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#39;");

}


/*
====================================================
NAVIGATION
====================================================
*/

nav.addEventListener("click",(event)=>{

const button=
event.target.closest("button[data-page]");

if(!button)return;

openPage(button.dataset.page);

});


/*
====================================================
AUTH SESSION CHECK
====================================================
*/

async function checkSession(){

if(!db){

throw new Error(
"Supabase client is not initialized."
);

}

setStatus(
"Checking existing CRM session..."
);

const result=await db.auth.getSession();

if(result.error){

throw result.error;

}

const session=result.data?.session;

if(session?.user){

currentUser=session.user;

showApp();

renderDashboard();

setStatus(
"Existing session restored.",
"success"
);

}else{

showLogin();

setStatus(
"CRM ready. Enter your email and password.",
"success"
);

}

}


/*
====================================================
AUTH STATE LISTENER
====================================================
*/

function setupAuthListener(){

if(!db)return;

db.auth.onAuthStateChange(
(event,session)=>{

console.log(
"Supabase Auth:",
event
);

if(event==="SIGNED_IN" && session?.user){

currentUser=session.user;

showApp();

renderDashboard();

}

if(event==="SIGNED_OUT"){

currentUser=null;

showLogin();

}

}
);

}


/*
====================================================
BUTTON EVENTS
====================================================
*/

loginBtn.addEventListener(
"click",
login
);

forgotBtn.addEventListener(
"click",
forgotPassword
);

logoutBtn.addEventListener(
"click",
logout
);

passwordInput.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

login();

}

}
);


/*
====================================================
START CRM
====================================================
*/

async function startCRM(){

try{

setStatus(
"Loading Supabase..."
);

await waitForSupabase();

setStatus(
"Supabase library loaded.",
"success"
);

await checkSession();

setupAuthListener();

}catch(error){

console.error(
"CRM START ERROR:",
error
);

setStatus(
"CRM initialization failed: "+
(error?.message || "Unknown error"),
"error"
);

setMessage(
"Initialization error: "+
(error?.message || "Unknown error")
);

}

}


/*
====================================================
START
====================================================
*/

startCRM();

</script>

</body>
</html>
